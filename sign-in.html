<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In | Campus Share</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      background: linear-gradient(135deg, #f6f9ff 0%, #e9f5ff 100%);
    }
    .card { 
      border-radius: 22px; 
      border: none; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .btn-primary {
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4 col-sm-8">
        <div class="card p-4 p-md-5">
          <h3 class="text-center fw-bold mb-4 text-primary">Campus Share</h3>
          <form>
            <input type="email" class="form-control mb-3" placeholder="Email" required />
            <input type="password" class="form-control mb-4" placeholder="Password" required />
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
            <p class="text-center small text-muted">
              Don't have an account? <a href="#" class="text-primary fw-semibold">Sign Up</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
